<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الارتباطات · مركز التحكم</title>
  <link rel="icon" href="cc-favicon.svg?v=20261003d">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="workspace.css?v=20261003d">
  <style>body{margin:0;font-family:'IBM Plex Sans Arabic',sans-serif;line-height:1.7}*{box-sizing:border-box}.ws-detail-page{max-width:1080px}.ws-detail-heading h1{margin:0;font-size:26px}.relation-controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:28px 0;border-bottom:1px solid var(--ws-line)}label{display:grid;gap:8px;font-size:13px;color:var(--ws-muted)}input,select{width:100%;min-width:0;padding:12px;border:1px solid var(--ws-line);border-radius:5px;background:white;color:var(--ws-ink)}#relation-results{padding-top:24px}.ws-connected-list{grid-template-columns:repeat(3,minmax(0,1fr))}.ws-connected-item{padding:18px 8px}.ws-connected-item span{flex:1}.relation-caption{color:var(--ws-muted);font-size:13px}@media(max-width:720px){.relation-controls{grid-template-columns:1fr}.ws-connected-list{grid-template-columns:1fr}.ws-detail-heading{align-items:stretch}}</style>
</head>
<body class="workspace">
<main class="ws-detail-page">
  <a href="index.html#map" class="ws-text-button">العودة إلى الملفات والمسارات</a>
  <header class="ws-detail-heading"><div><h1>الارتباطات</h1><p class="relation-caption" id="relation-count"></p></div><img src="cc-icon.svg?v=20261003d" alt="مركز التحكم" width="44" height="44"></header>
  <div class="relation-controls"><label>بحث عن عنصر<input id="relation-query" type="search" autocomplete="off"></label><label>العنصر<select id="relation-entity"><option value="">اختر عنصرًا</option></select></label></div>
  <div id="relation-results" aria-live="polite"></div>
</main>
<script src="data.js?v=20261003d"></script><script src="workspace-model.js?v=20261003d"></script><script src="relationships.js?v=20261003d"></script>
</body></html>

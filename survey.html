<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استبيان بيانات الموظف — BRIX TRAVEL / Etranex</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --card: #fff;
  --t1: #0f172a;
  --t2: #475569;
  --t3: #94a3b8;
  --border: rgba(15, 23, 42, 0.08);
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --success: #10b981;
  --danger: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
  background: var(--bg);
  color: var(--t1);
  line-height: 1.6;
  padding: 20px 12px;
  min-height: 100vh;
}
.container {
  max-width: 720px;
  margin: 0 auto;
}
.header {
  text-align: center;
  padding: 24px 16px;
  margin-bottom: 18px;
}
.header h1 {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 6px;
}
.header p {
  font-size: 13.5px;
  color: var(--t2);
  max-width: 540px;
  margin: 0 auto;
}
.section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 18px;
  margin-bottom: 14px;
}
.section-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--border);
}
.section-title-num {
  width: 26px;
  height: 26px;
  background: var(--primary);
  color: #fff;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
}
.field {
  margin-bottom: 14px;
}
.field-label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--t2);
  margin-bottom: 5px;
}
.field-required::after {
  content: " *";
  color: var(--danger);
}
.field-hint {
  font-size: 11px;
  color: var(--t3);
  margin-top: 3px;
  margin-bottom: 0;
}
input[type="text"],
input[type="email"],
input[type="tel"],
input[type="date"],
input[type="number"],
select,
textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-family: inherit;
  font-size: 13.5px;
  color: var(--t1);
  background: var(--card);
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
}
textarea {
  min-height: 80px;
  resize: vertical;
}
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.langs-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 8px;
}
.lang-check {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 10px;
  background: rgba(0, 0, 0, 0.025);
  border-radius: 8px;
  font-size: 12.5px;
  cursor: pointer;
}
.lang-check input { width: auto; }
.actions {
  position: sticky;
  bottom: 0;
  background: linear-gradient(to top, var(--bg) 70%, transparent);
  padding: 18px 0 12px;
  display: flex;
  gap: 10px;
}
.btn {
  flex: 1;
  padding: 13px;
  border: 0;
  border-radius: 12px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover {
  background: var(--primary-dark);
  transform: translateY(-1px);
  box-shadow: 0 6px 16px -4px var(--primary);
}
.btn-secondary {
  background: rgba(0, 0, 0, 0.05);
  color: var(--t1);
}
.success-msg, .copy-msg {
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.3);
  color: #047857;
  padding: 14px 16px;
  border-radius: 12px;
  margin-bottom: 14px;
  font-size: 13px;
  display: none;
}
.success-msg.show, .copy-msg.show { display: block; }
.output-area {
  background: #0f172a;
  color: #a5f3fc;
  padding: 14px;
  border-radius: 10px;
  font-family: monospace;
  font-size: 11px;
  direction: ltr;
  overflow-x: auto;
  max-height: 300px;
  overflow-y: auto;
  margin-top: 10px;
  display: none;
}
.output-area.show { display: block; }
.contract-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.contract-opt {
  padding: 10px;
  text-align: center;
  background: rgba(0, 0, 0, 0.03);
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.15s;
}
.contract-opt input { display: none; }
.contract-opt.selected {
  background: var(--primary);
  color: #fff;
}
@media (max-width: 540px) {
  .field-row, .contract-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>📋 استبيان بيانات الموظف</h1>
    <p>أهلاً بك في فريق <strong>BRIX TRAVEL</strong> / <strong>Etranex</strong>. املأ هذه الاستمارة (5 دقائق) لتحديث ملفك في النظام.</p>
  </div>

  <div class="success-msg" id="success">
    ✓ تم! انسخ النص أدناه وأرسله للإدارة (واتساب أو بريد).
  </div>

  <form id="surveyForm">

    <!-- ── 1) الهوية ── -->
    <div class="section">
      <div class="section-title">
        <span class="section-title-num">1</span>
        👤 الهوية الأساسية
      </div>
      <div class="field">
        <label class="field-label field-required">الاسم بالعربية (الذي تُنادى به)</label>
        <input type="text" name="name" required placeholder="مثال: رباب">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">الاسم بالإنجليزية</label>
          <input type="text" name="name_en" placeholder="Rabab" dir="ltr">
        </div>
        <div class="field">
          <label class="field-label">الاسم الكامل</label>
          <input type="text" name="full_name" placeholder="رباب محمد علي">
        </div>
      </div>
      <div class="field">
        <label class="field-label">الجنسية</label>
        <input type="text" name="nationality" placeholder="ليبية / تركية / سورية ...">
      </div>
      <div class="field">
        <label class="field-label">اللغات التي تتحدثها</label>
        <div class="langs-grid">
          <label class="lang-check"><input type="checkbox" name="languages" value="عربي"> عربي</label>
          <label class="lang-check"><input type="checkbox" name="languages" value="تركي"> تركي</label>
          <label class="lang-check"><input type="checkbox" name="languages" value="إنجليزي"> إنجليزي</label>
          <label class="lang-check"><input type="checkbox" name="languages" value="فرنسي"> فرنسي</label>
          <label class="lang-check"><input type="checkbox" name="languages" value="روسي"> روسي</label>
          <label class="lang-check"><input type="checkbox" name="languages" value="ألماني"> ألماني</label>
        </div>
      </div>
    </div>

    <!-- ── 2) التواصل ── -->
    <div class="section">
      <div class="section-title">
        <span class="section-title-num">2</span>
        📞 التواصل المباشر
      </div>
      <div class="field">
        <label class="field-label field-required">رقم الهاتف</label>
        <input type="tel" name="phone" required placeholder="+90 535 818 29 50" dir="ltr">
      </div>
      <div class="field">
        <label class="field-label">رقم واتساب (إن كان مختلف)</label>
        <input type="tel" name="whatsapp" placeholder="إن كان نفس الرقم اتركه فارغاً" dir="ltr">
      </div>
      <div class="field">
        <label class="field-label">اسم العرض على واتساب</label>
        <input type="text" name="whatsapp_display_name" placeholder="مثال: رباب — EasyBooking ✈️">
        <p class="field-hint">كيف يظهر اسمك للزبون عندما تراسله</p>
      </div>
      <div class="field">
        <label class="field-label">البريد الإلكتروني للعمل</label>
        <input type="email" name="email_work" placeholder="rabab@brix.travel" dir="ltr">
      </div>
      <div class="field">
        <label class="field-label">معرّف تيليجرام</label>
        <input type="text" name="telegram" placeholder="@rabab_brix" dir="ltr">
      </div>
      <div class="field">
        <label class="field-label">موقع المكتب</label>
        <input type="text" name="location_office" placeholder="مكتب أنطاليا - السنتر">
      </div>
    </div>

    <!-- ── 3) العمل ── -->
    <div class="section">
      <div class="section-title">
        <span class="section-title-num">3</span>
        💼 معلومات العمل
      </div>
      <div class="field">
        <label class="field-label field-required">القسم</label>
        <select name="department" required>
          <option value="">— اختر —</option>
          <option value="brix-b2b">🏢 BRIX B2B (الوكلاء والفنادق)</option>
          <option value="easybooking">📢 EasyBooking (B2C)</option>
          <option value="rihlaty">✈️ Rihlaty Travel (B2C)</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label field-required">الدور / المنصب</label>
        <input type="text" name="role" required placeholder="موظفة مبيعات وإعلانات">
      </div>
      <div class="field">
        <label class="field-label">المدير المباشر</label>
        <input type="text" name="manager" placeholder="اسم المدير">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">تاريخ الانضمام</label>
          <input type="date" name="hire_date">
        </div>
        <div class="field">
          <label class="field-label">ساعات العمل</label>
          <input type="text" name="working_hours" placeholder="9:00 - 18:00">
        </div>
      </div>
      <div class="field">
        <label class="field-label">نوع التعاقد</label>
        <div class="contract-grid">
          <label class="contract-opt" data-contract="full-time">
            <input type="radio" name="contract_type" value="full-time"> دوام كامل
          </label>
          <label class="contract-opt" data-contract="part-time">
            <input type="radio" name="contract_type" value="part-time"> دوام جزئي
          </label>
          <label class="contract-opt" data-contract="freelance">
            <input type="radio" name="contract_type" value="freelance"> فريلانس
          </label>
        </div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-secondary" onclick="resetForm()">مسح</button>
      <button type="submit" class="btn btn-primary">📋 توليد البيانات للنسخ</button>
    </div>

    <div class="output-area" id="output"></div>

  </form>
</div>

<script>
// تفعيل خيارات التعاقد
document.querySelectorAll(".contract-opt").forEach((opt) => {
  opt.addEventListener("click", () => {
    document.querySelectorAll(".contract-opt").forEach((o) => o.classList.remove("selected"));
    opt.classList.add("selected");
    opt.querySelector("input").checked = true;
  });
});

// توليد JSON من النموذج
document.getElementById("surveyForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = {};
  for (const [key, val] of fd.entries()) {
    if (key === "languages") {
      data.languages = data.languages || [];
      data.languages.push(val);
    } else if (val) {
      data[key] = val;
    }
  }
  // افتراضات منطقية
  data.parent = "brix";
  data.status = "active";
  if (!data.whatsapp && data.phone) {
    data.whatsapp = data.phone.replace(/\D/g, "");
  }
  // قالب جاهز للصق في data.js
  const id = (data.name_en || data.name || "new")
    .toLowerCase()
    .replace(/\s+/g, "-")
    .replace(/[^a-z0-9-]/g, "");
  const cl = data.department === "rihlaty" ? "#10B981" : "#2563EB";
  const template = `  {
    id: "${id}",
    name: "${data.name || ""}",
    name_en: ${data.name_en ? `"${data.name_en}"` : "null"},
    full_name: ${data.full_name ? `"${data.full_name}"` : "null"},
    nationality: ${data.nationality ? `"${data.nationality}"` : "null"},
    languages: ${JSON.stringify(data.languages || [])},
    phone: "${data.phone || ""}",
    phone_local: "${(data.phone || "").replace(/^\+/, "00").replace(/\s/g, "")}",
    whatsapp: "${(data.whatsapp || data.phone || "").replace(/\D/g, "")}",
    whatsapp_display_name: ${data.whatsapp_display_name ? `"${data.whatsapp_display_name}"` : "null"},
    email_work: ${data.email_work ? `"${data.email_work}"` : "null"},
    telegram: ${data.telegram ? `"${data.telegram}"` : "null"},
    location_office: ${data.location_office ? `"${data.location_office}"` : "null"},
    department: "${data.department || ""}",
    parent: "brix",
    role: "${data.role || ""}",
    manager: ${data.manager ? `"${data.manager}"` : "null"},
    hire_date: ${data.hire_date ? `"${data.hire_date}"` : "null"},
    contract_type: ${data.contract_type ? `"${data.contract_type}"` : "null"},
    working_hours: ${data.working_hours ? `"${data.working_hours}"` : "null"},
    assigned_projects: [${data.department === "easybooking" ? '"easybooking"' : data.department === "rihlaty" ? '"rihlaty-travel"' : ""}],
    salary_usd: null,
    status: "active",
    em: "👤",
    cl: "${cl}",
  },`;
  const out = document.getElementById("output");
  out.textContent = template;
  out.classList.add("show");
  document.getElementById("success").classList.add("show");
  // نسخ للحافظة تلقائياً
  navigator.clipboard.writeText(template).then(() => {
    document.getElementById("success").innerHTML = "✓ تم نسخ البيانات للحافظة! أرسلها للإدارة.";
  });
  out.scrollIntoView({ behavior: "smooth", block: "start" });
});

function resetForm() {
  document.getElementById("surveyForm").reset();
  document.querySelectorAll(".contract-opt").forEach((o) => o.classList.remove("selected"));
  document.getElementById("output").classList.remove("show");
  document.getElementById("success").classList.remove("show");
}
</script>

</body>
</html>

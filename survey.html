<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استبيان بيانات الموظف — BRIX TRAVEL / Etranex</title>
<link rel="icon" href="cc-favicon.svg?v=20261003d">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f5f7;
  --card: #fff;
  --t1: #202124;
  --t2: #65666e;
  --t3: #65666e;
  --border: #dedee5;
  --primary: #0067ce;
  --primary-dark: #0057b0;
  --success: #10b981;
  --danger: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
  background: var(--bg);
  color: var(--t1);
  line-height: 1.6;
  padding: 20px 12px;
  min-height: 100vh;
}
.container {
  max-width: 720px;
  margin: 0 auto;
}
.header {
  text-align: start;
  padding: 30px 0;
  margin-bottom: 6px;
}
.header h1 {
  font-size: 28px;
  font-weight: 600;
  margin-top: 22px;
  margin-bottom: 6px;
}
.header p {
  font-size: 13.5px;
  color: var(--t2);
  max-width: 540px;
  margin: 0;
}
.section {
  background: transparent;
  border: 0;
  border-top: 1px solid var(--border);
  border-radius: 0;
  padding: 28px 0;
  margin-bottom: 0;
}
.section-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 12px;
  border-bottom: 0;
}
.section-title-num {
  width: 26px;
  height: 26px;
  background: #e7f1ff;
  color: var(--primary);
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
}
.field {
  margin-bottom: 14px;
}
.field-label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--t2);
  margin-bottom: 5px;
}
.field-required::after {
  content: " *";
  color: var(--danger);
}
.field-hint {
  font-size: 11px;
  color: var(--t3);
  margin-top: 3px;
  margin-bottom: 0;
}
input[type="text"],
input[type="email"],
input[type="tel"],
input[type="date"],
input[type="number"],
select,
textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: inherit;
  font-size: 16px;
  color: var(--t1);
  background: var(--card);
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px #0071e319;
}
textarea {
  min-height: 80px;
  resize: vertical;
}
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.langs-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 8px;
}
.lang-check {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 10px;
  background: rgba(0, 0, 0, 0.025);
  border-radius: 8px;
  font-size: 12.5px;
  cursor: pointer;
}
.lang-check input { width: auto; }
.actions {
  position: sticky;
  bottom: 0;
  background: #f5f5f7ed;
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  padding: 18px 0 12px;
  display: flex;
  gap: 10px;
}
.btn {
  flex: 1;
  padding: 13px;
  border: 0;
  border-radius: 6px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 0.15s;
}
.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover {
  background: var(--primary-dark);
}
.btn-secondary {
  background: rgba(0, 0, 0, 0.05);
  color: var(--t1);
}
.success-msg, .copy-msg {
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.3);
  color: #047857;
  padding: 14px 16px;
  border-radius: 8px;
  margin-bottom: 14px;
  font-size: 13px;
  display: none;
}
.success-msg.show, .copy-msg.show { display: block; }
.output-area {
  background: #252529;
  color: #edf0f5;
  padding: 14px;
  border-radius: 8px;
  font-family: monospace;
  font-size: 11px;
  direction: ltr;
  overflow-x: auto;
  max-height: 300px;
  overflow-y: auto;
  margin-top: 10px;
  display: none;
}
.output-area.show { display: block; }
.contract-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.contract-opt {
  padding: 10px;
  text-align: center;
  background: rgba(0, 0, 0, 0.03);
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.15s;
}
.contract-opt input { display:inline-block; width:auto; accent-color:var(--primary); }
.contract-opt:focus-within { outline:2px solid var(--primary); outline-offset:2px; }
@media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
.contract-opt.selected {
  background: var(--primary);
  color: #fff;
}
@media (max-width: 540px) {
  .field-row, .contract-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <a href="index.html#team" style="color:var(--primary)">العودة إلى الفريق</a>
    <h1>استبيان بيانات الموظف</h1>
    <p>بيانات فريق BRIX. ينتج هذا النموذج نصًا للمراجعة، ولا يحفظ ملف الموظف في اللوحة تلقائيًا.</p>
  </div>

  <div class="success-msg" id="success">
    ✓ تم! انسخ النص أدناه وأرسله للإدارة (واتساب أو بريد).
  </div>

  <form id="surveyForm">

    <!-- ── 1) الهوية ── -->
    <div class="section">
      <div class="section-title">
        <span class="section-title-num">1</span>
        👤 الهوية الأساسية
      </div>
      <div class="field">
        <label class="field-label field-required">الاسم بالعربية (الذي تُنادى به)</label>
        <input type="text" name="name" required placeholder="مثال: رباب">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">الاسم بالإنجليزية</label>
          <input type="text" name="name_en" placeholder="Rabab" dir="ltr">
        </div>
        <div class="field">
          <label class="field-label">الاسم الكامل</label>
          <input type="text" name="full_name" placeholder="رباب محمد علي">
        </div>
      </div>
      <div class="field">
        <label class="field-label">الجنسية</label>
        <input type="text" name="nationality" placeholder="ليبية / تركية / سورية ...">
      </div>
      <div class="field">
        <label class="field-label">اللغات التي تتحدثها</label>
        <div class="langs-grid">
          <label class="lang-check"><input type="checkbox" name="languages" value="عربي"> عربي</label>
          <label class="lang-check"><input type="checkbox" name="languages" value="تركي"> تركي</label>
          <label class="lang-check"><input type="checkbox" name="languages" value="إنجليزي"> إنجليزي</label>
          <label class="lang-check"><input type="checkbox" name="languages" value="فرنسي"> فرنسي</label>
          <label class="lang-check"><input type="checkbox" name="languages" value="روسي"> روسي</label>
          <label class="lang-check"><input type="checkbox" name="languages" value="ألماني"> ألماني</label>
        </div>
      </div>
    </div>

    <!-- ── 2) التواصل ── -->
    <div class="section">
      <div class="section-title">
        <span class="section-title-num">2</span>
        📞 التواصل المباشر
      </div>
      <div class="field">
        <label class="field-label field-required">رقم الهاتف</label>
        <input type="tel" name="phone" required placeholder="+90 535 818 29 50" dir="ltr">
      </div>
      <div class="field">
        <label class="field-label">رقم واتساب (إن كان مختلف)</label>
        <input type="tel" name="whatsapp" placeholder="إن كان نفس الرقم اتركه فارغاً" dir="ltr">
      </div>
      <div class="field">
        <label class="field-label">اسم العرض على واتساب</label>
        <input type="text" name="whatsapp_display_name" placeholder="مثال: رباب — EasyBooking ✈️">
        <p class="field-hint">كيف يظهر اسمك للزبون عندما تراسله</p>
      </div>
      <div class="field">
        <label class="field-label">البريد الإلكتروني للعمل</label>
        <input type="email" name="email_work" placeholder="rabab@brix.travel" dir="ltr">
      </div>
      <div class="field">
        <label class="field-label">معرّف تيليجرام</label>
        <input type="text" name="telegram" placeholder="@rabab_brix" dir="ltr">
      </div>
      <div class="field">
        <label class="field-label">موقع المكتب</label>
        <input type="text" name="location_office" placeholder="مكتب أنطاليا - السنتر">
      </div>
    </div>

    <!-- ── 3) العمل ── -->
    <div class="section">
      <div class="section-title">
        <span class="section-title-num">3</span>
        💼 معلومات العمل
      </div>
      <div class="field">
        <label class="field-label field-required">القسم</label>
        <select name="department" required>
          <option value="">— اختر —</option>
          <option value="brix-b2b">🏢 BRIX B2B (الوكلاء والفنادق)</option>
          <option value="easybooking">📢 EasyBooking (B2C)</option>
          <option value="rihlaty">✈️ Rihlaty Travel (B2C)</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label field-required">الدور / المنصب</label>
        <input type="text" name="role" required placeholder="موظفة مبيعات وإعلانات">
      </div>
      <div class="field">
        <label class="field-label">المدير المباشر</label>
        <input type="text" name="manager" placeholder="اسم المدير">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">تاريخ الانضمام</label>
          <input type="date" name="hire_date">
        </div>
        <div class="field">
          <label class="field-label">ساعات العمل</label>
          <input type="text" name="working_hours" placeholder="9:00 - 18:00">
        </div>
      </div>
      <div class="field">
        <label class="field-label">نوع التعاقد</label>
        <div class="contract-grid">
          <label class="contract-opt" data-contract="full-time">
            <input type="radio" name="contract_type" value="full-time"> دوام كامل
          </label>
          <label class="contract-opt" data-contract="part-time">
            <input type="radio" name="contract_type" value="part-time"> دوام جزئي
          </label>
          <label class="contract-opt" data-contract="freelance">
            <input type="radio" name="contract_type" value="freelance"> فريلانس
          </label>
        </div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-secondary" onclick="resetForm()">مسح</button>
      <button type="submit" class="btn btn-primary">📋 توليد البيانات للنسخ</button>
    </div>

    <div class="output-area" id="output"></div>

  </form>
</div>

<script src="survey-model.js?v=20261003d"></script>
<script>
document.querySelectorAll('.field').forEach(field => {
  const input=field.querySelector('input:not([type="radio"]):not([type="checkbox"]),select,textarea'),label=field.querySelector('.field-label');
  if(input && label) { input.id='field-'+input.name; label.htmlFor=input.id; }
});
document.querySelectorAll('.contract-opt input').forEach(input => input.addEventListener('change',() => {
  document.querySelectorAll('.contract-opt').forEach(option => option.classList.toggle('selected',option.querySelector('input').checked));
}));
document.getElementById('surveyForm').addEventListener('submit',async event => {
  event.preventDefault();
  const form=new FormData(event.target);
  const data={...Object.fromEntries(form.entries()),languages:form.getAll('languages')};
  const message=document.getElementById('success');
  try {
    const result=SurveyModel.member(data,crypto.randomUUID());
    const text=JSON.stringify(result,null,2);
    const output=document.getElementById('output');
    output.textContent=text;
    output.classList.add('show');
    message.classList.add('show');
    try { await navigator.clipboard.writeText(text); message.textContent='تم نسخ البيانات. لم تُرسل أو تُحفظ في اللوحة.'; }
    catch { message.textContent='البيانات جاهزة أدناه، لكن تعذر نسخها تلقائيًا. لم تُرسل أو تُحفظ في اللوحة.'; }
    output.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});
  } catch(error) { message.textContent=error.message; message.classList.add('show'); }
});
function resetForm() {
  document.getElementById('surveyForm').reset();
  document.querySelectorAll('.contract-opt').forEach(option => option.classList.remove('selected'));
  document.getElementById('output').textContent='';
  document.getElementById('output').classList.remove('show');
  document.getElementById('success').classList.remove('show');
}
</script>

</body>
</html>

  </circle>
  <g><animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="6s" repeatCount="indefinite"/>
    <circle cx="52" cy="32" r="2.4" fill="#F472B6"/></g>
  <g transform="rotate(-22 32 32)"><g><animateTransform attributeName="transform" type="rotate" from="360 32 32" to="0 32 32" dur="4s" repeatCount="indefinite"/>
    <circle cx="47" cy="32" r="1.8" fill="#22D3EE"/></g></g>
  <circle cx="50" cy="14" r="2.2" fill="#22C55E">

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">

      <stop offset="0%" stop-color="#22d3ee"/>

      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4f8ff7"/>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Command Center</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --bg:#08080D;--bg2:#0E0E15;--bg3:#14141E;--bg4:#1A1A28;--bgH:#1F1F30;
  --purple:#7C4DFF;--blue:#2979FF;--green:#00E676;--amber:#FFD740;--red:#FF5252;--cyan:#18FFFF;
  --t1:#EAEAF0;--t2:#9A9AB0;--t3:#6B6B80;
  --brd:rgba(255,255,255,.06);--brdH:rgba(255,255,255,.12);
  --r-s:8px;--r-m:12px;--r-l:16px;--r-xl:20px;--r-f:9999px;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --fast:150ms;--norm:250ms;--slow:400ms
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(124,77,255,.06),transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(41,121,255,.04),transparent 60%);pointer-events:none;z-index:0}
*:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
*:focus:not(:focus-visible){outline:none}

/* ═══ SIDEBAR NAV (Desktop) ═══ */
.sidebar{position:fixed;top:0;right:0;bottom:0;width:72px;z-index:90;display:flex;flex-direction:column;padding:16px 0;background:rgba(8,8,13,.95);backdrop-filter:blur(24px);border-left:1px solid var(--brd);transition:width var(--slow) var(--ease);overflow:hidden}
.sidebar:hover{width:260px}
.sidebar-brand{padding:16px 0 12px;text-align:center;margin-bottom:8px;border-bottom:1px solid var(--brd)}
.sidebar-brand-icon{font-size:28px;display:block;margin-bottom:4px}
.sidebar-brand-text{font-size:13px;font-weight:700;color:var(--purple);letter-spacing:-.3px;white-space:nowrap;overflow:hidden;opacity:0;max-height:0;transition:opacity var(--norm),max-height var(--norm)}
.sidebar:hover .sidebar-brand-text{opacity:1;max-height:20px}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 8px;overflow-y:auto}
.sidebar-nav::-webkit-scrollbar{display:none}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-m);cursor:pointer;transition:all var(--norm) var(--ease);color:var(--t3);position:relative;white-space:nowrap;animation:slideInRight .4s var(--ease) both}
.sidebar-item:nth-child(1){animation-delay:.05s}.sidebar-item:nth-child(2){animation-delay:.1s}.sidebar-item:nth-child(3){animation-delay:.15s}
.sidebar-item:nth-child(4){animation-delay:.2s}.sidebar-item:nth-child(5){animation-delay:.25s}.sidebar-item:nth-child(6){animation-delay:.3s}
.sidebar-item:nth-child(7){animation-delay:.35s}.sidebar-item:nth-child(8){animation-delay:.4s}.sidebar-item:nth-child(9){animation-delay:.45s}.sidebar-item:nth-child(10){animation-delay:.5s}
.sidebar-item:hover{color:var(--t1);background:var(--bg3)}
.sidebar-item.on{color:#fff;background:linear-gradient(135deg,var(--purple),var(--blue));box-shadow:0 4px 20px rgba(124,77,255,.25)}
.sidebar-item.on::before{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);width:3px;height:24px;background:#fff;border-radius:3px}
.sidebar-item-icon{font-size:18px;width:28px;text-align:center;flex-shrink:0}
.sidebar-item-label{font-size:12px;font-weight:500;overflow:hidden;opacity:0;transition:opacity var(--norm)}
.sidebar:hover .sidebar-item-label{opacity:1}

/* ═══ BOTTOM BAR (Mobile) ═══ */
.bottom-bar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:90;padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));background:rgba(8,8,13,.95);backdrop-filter:blur(24px);border-top:1px solid var(--brd)}
.bottom-bar-items{display:flex;justify-content:space-around;align-items:center}
.bottom-bar-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:var(--r-m);cursor:pointer;transition:all var(--fast);color:var(--t3);font-size:8px;min-width:44px}
.bottom-bar-item.on{color:var(--purple)}
.bottom-bar-item.on .bottom-bar-item-icon{transform:scale(1.1)}
.bottom-bar-item-icon{font-size:20px;transition:transform var(--fast)}
.more-sheet-ov{display:none;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}.more-sheet-ov.open{display:block}
.more-sheet{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--bg2);border-top:1px solid var(--brd);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:20px 16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.more-sheet.open{display:block;animation:expandDown var(--norm) var(--ease)}
.more-sheet-handle{width:40px;height:4px;background:var(--bg4);border-radius:2px;margin:0 auto 16px}
.more-sheet-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.more-sheet-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:var(--r-m);cursor:pointer;color:var(--t3);font-size:9px;transition:all var(--fast)}
.more-sheet-item.on{color:var(--purple);background:rgba(124,77,255,.08)}
.more-sheet-item:active{transform:scale(.95)}

/* ═══ PAGES ═══ */
.page{display:none;min-height:100vh;padding:28px 28px 60px 28px;padding-right:88px;position:relative;z-index:1}
.page.on{display:block;animation:fadeSlide .5s var(--ease)}

@keyframes fadeSlide{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 4px currentColor}50%{box-shadow:0 0 16px currentColor}}
@keyframes scanLine{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pressScale{0%{transform:scale(1)}50%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.7}}
@keyframes slideInRight{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes expandDown{from{max-height:0;opacity:0}to{max-height:600px;opacity:1}}
@keyframes aurora{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes cardReveal{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}

/* ═══ HOME ═══ */
.home{background:linear-gradient(180deg,#0D0A18 0%,var(--bg) 60%);position:relative;overflow:hidden}
.home::before{content:'';position:absolute;top:-200px;right:-200px;width:700px;height:700px;background:radial-gradient(circle,rgba(124,77,255,.08),transparent 70%);pointer-events:none}
.home::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(124,77,255,.08) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;opacity:.3}
.home-hero{max-width:900px;margin:0 auto;padding:48px 0 40px;position:relative}
.home-greeting{font-size:12px;color:var(--purple);font-weight:600;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;animation:countUp .6s var(--ease)}
.home-title{font-size:clamp(32px,5.5vw,52px);font-weight:700;line-height:1.1;letter-spacing:-1.5px;margin-bottom:14px;animation:countUp .6s .1s var(--ease) both}
.home-title span{background:linear-gradient(135deg,var(--t1) 30%,var(--purple) 70%,var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.home-sub{font-size:14px;color:var(--t3);line-height:1.7;max-width:480px;margin-bottom:36px;animation:countUp .6s .2s var(--ease) both}
.ring-wrap{display:flex;align-items:center;gap:36px;margin-bottom:40px;flex-wrap:wrap}
.ring{width:160px;height:160px;position:relative;flex-shrink:0;animation:breathe 4s ease-in-out infinite}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bg3);stroke-width:6}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1.5s var(--ease)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-size:40px;font-weight:700;font-family:var(--mono);background:linear-gradient(135deg,var(--red),var(--amber));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ring-lbl{font-size:10px;color:var(--t3);letter-spacing:2px;text-transform:uppercase}
.ring-info h3{font-size:16px;font-weight:700;margin-bottom:4px}
.ring-info p{font-size:11px;color:var(--t3);line-height:1.7}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:36px}
.pill{display:flex;align-items:center;gap:8px;padding:8px 16px 8px 10px;border-radius:var(--r-f);background:var(--bg2);border:1px solid var(--brd);cursor:pointer;transition:all var(--norm) var(--ease);font-size:12px;animation:countUp .6s var(--ease) both}
.pill:nth-child(1){animation-delay:.3s}.pill:nth-child(2){animation-delay:.35s}.pill:nth-child(3){animation-delay:.4s}
.pill:nth-child(4){animation-delay:.45s}.pill:nth-child(5){animation-delay:.5s}.pill:nth-child(6){animation-delay:.55s}.pill:nth-child(7){animation-delay:.6s}
.pill:hover{background:var(--bg3);border-color:var(--brdH);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.pill-ic{font-size:16px}.pill-v{font-weight:700;font-size:15px;font-family:var(--mono)}.pill-l{color:var(--t3)}
.feed{border-right:2px solid var(--bg3);padding-right:20px;max-width:600px}
.feed-item{position:relative;padding:0 16px 20px;font-size:13px;animation:cardReveal .5s var(--ease) both}
.feed-item:nth-child(1){animation-delay:.1s}.feed-item:nth-child(2){animation-delay:.2s}.feed-item:nth-child(3){animation-delay:.3s}.feed-item:nth-child(4){animation-delay:.4s}
.feed-item::before{content:'';position:absolute;right:-27px;top:4px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg)}
.feed-item:nth-child(1)::before{background:var(--purple)}.feed-item:nth-child(2)::before{background:var(--blue)}.feed-item:nth-child(3)::before{background:var(--green)}.feed-item:nth-child(4)::before{background:var(--amber)}
.feed-date{font-size:10px;color:var(--t3);font-family:var(--mono);margin-bottom:2px}
.feed-text{color:var(--t2);line-height:1.6}.feed-text strong{color:var(--t1)}

/* ═══ PROJECTS ═══ */
.proj{background:var(--bg);position:relative;overflow:hidden}
.proj::before{content:'';position:absolute;top:50%;left:50%;width:140%;height:140%;transform:translate(-50%,-50%);background:conic-gradient(from 180deg,rgba(124,77,255,.05),rgba(41,121,255,.05),rgba(0,230,118,.03),rgba(255,82,82,.03),rgba(124,77,255,.05));animation:aurora 30s linear infinite;pointer-events:none}
.proj-head{text-align:center;margin-bottom:32px;position:relative}.proj-head h2{font-size:24px;font-weight:700;letter-spacing:-.5px}.proj-head p{font-size:12px;color:var(--t3);margin-top:4px}
.glass-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;position:relative}
.glass{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r-xl);padding:24px;cursor:pointer;transition:all var(--slow) var(--ease);position:relative;overflow:hidden;animation:cardReveal .5s var(--ease) both}
.glass::before{content:'';position:absolute;inset:0;border-radius:var(--r-xl);background:linear-gradient(135deg,rgba(255,255,255,.03),transparent 50%);pointer-events:none;opacity:0;transition:opacity var(--norm)}
.glass:hover{transform:translateY(-4px);border-color:var(--brdH);box-shadow:0 16px 48px rgba(0,0,0,.25)}.glass:hover::before{opacity:1}
.glass:active{animation:pressScale var(--fast) var(--ease)}
.glass-stripe{height:3px;border-radius:2px;margin-bottom:16px}
.glass-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.glass-em{font-size:28px}.glass-nm{font-size:15px;font-weight:700;letter-spacing:-.3px}
.glass-st{font-size:10px;padding:3px 10px;border-radius:var(--r-f);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.glass-st.a{background:rgba(0,230,118,.1);color:var(--green)}.glass-st.a::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:dotPulse 2s infinite}
.glass-st.p{background:rgba(255,215,64,.1);color:var(--amber)}
.glass-desc{font-size:11px;color:var(--t2);line-height:1.7;margin:10px 0 14px;white-space:pre-line}
.glass-tags{display:flex;flex-wrap:wrap;gap:4px}.glass-tag{font-size:9px;padding:3px 8px;border-radius:var(--r-s);background:var(--bg3);color:var(--t2);border:1px solid var(--brd)}
.glass.bento{grid-column:span 2}

/* ═══ MAP ═══ */
.map-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.map-stat{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r-l);padding:14px;text-align:center}
.map-stat-v{font-size:24px;font-weight:800;font-family:var(--mono)}.map-stat-l{font-size:10px;color:var(--t3);margin-top:2px}
.map-filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.mf{font-size:11px;padding:6px 16px;border-radius:var(--r-f);border:1px solid var(--brd);background:var(--bg2);color:var(--t3);cursor:pointer;font-family:var(--font);transition:all var(--norm)}
.mf:hover{border-color:var(--brdH);color:var(--t2)}
.mf.active{background:rgba(124,77,255,.12);border-color:rgba(124,77,255,.3);color:var(--purple);font-weight:600}
.mc{background:var(--bg2);border-radius:var(--r-l);padding:14px 16px;margin-bottom:8px;border:1px solid var(--brd);transition:all var(--norm) var(--ease);animation:cardReveal .5s var(--ease) both}
.mc:hover{transform:translateY(-2px);border-color:var(--brdH);box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* ═══ AUTO ═══ */
.auto-page{background:linear-gradient(180deg,#030810,var(--bg));position:relative}
.auto-page::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--green),transparent);animation:scanLine 4s linear infinite;pointer-events:none}
.auto-stat{background:linear-gradient(180deg,#061210,#060d1a);border:1px solid rgba(0,230,118,.1);border-radius:var(--r-l);padding:16px;text-align:center}
.auto-stat-v{font-size:24px;font-weight:800;font-family:var(--mono);color:var(--green)}.auto-stat-l{font-size:9px;color:rgba(0,230,118,.5);text-transform:uppercase;letter-spacing:2px;margin-top:4px}
.auto-section{background:var(--bg2);border-radius:var(--r-xl);padding:20px;margin-bottom:16px;border:1px solid var(--brd);animation:cardReveal .5s var(--ease) both}
.auto-task{background:var(--bg);border-radius:var(--r-m);padding:12px 14px;margin-top:8px;border:1px solid var(--brd);display:flex;align-items:center;gap:12px;transition:all var(--norm)}
.auto-task:hover{border-color:var(--brdH);background:var(--bg3)}
.auto-led{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.auto-led.on{background:var(--green);box-shadow:0 0 8px var(--green);animation:glowPulse 2s infinite}
.auto-led.amber{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:glowPulse 3s infinite}

/* ═══ SERVER HUD ═══ */
.srv{background:linear-gradient(180deg,#030810,var(--bg));position:relative}
.srv::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(24,255,255,.01) 2px,rgba(24,255,255,.01) 4px);pointer-events:none;opacity:.4}
.srv::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scanLine 4s linear infinite;pointer-events:none}
.hud{max-width:900px;margin:0 auto;position:relative}
.hud-title{text-align:center;margin-bottom:28px}.hud-title h2{font-size:20px;font-weight:700;font-family:var(--mono);color:var(--cyan);text-shadow:0 0 20px rgba(24,255,255,.3);letter-spacing:3px;text-transform:uppercase}.hud-title p{font-size:10px;color:rgba(24,255,255,.4);font-family:var(--mono);letter-spacing:3px}
.hud-gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.gauge{background:linear-gradient(180deg,#0a1628,#060d1a);border:1px solid rgba(24,255,255,.1);border-radius:var(--r-l);padding:18px;text-align:center;position:relative;overflow:hidden;animation:cardReveal .4s var(--ease) both}
.gauge::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
.gauge::after{content:'⟨';position:absolute;top:6px;right:8px;color:rgba(24,255,255,.15);font-size:16px;font-family:var(--mono)}
.gauge:nth-child(1){animation-delay:.05s}.gauge:nth-child(2){animation-delay:.1s}.gauge:nth-child(3){animation-delay:.15s}.gauge:nth-child(4){animation-delay:.2s}
.gauge-v{font-size:26px;font-weight:700;font-family:var(--mono)}.gauge-l{font-size:9px;color:rgba(24,255,255,.5);text-transform:uppercase;letter-spacing:2px;margin-top:4px}
.hud-list{background:#060d1a;border:1px solid rgba(24,255,255,.08);border-radius:var(--r-l);overflow:hidden}
.hud-row{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid rgba(24,255,255,.05);transition:background var(--fast);cursor:pointer;font-family:var(--mono);font-size:12px;animation:cardReveal .4s var(--ease) both}
.hud-row:last-child{border-bottom:none}.hud-row:hover{background:rgba(24,255,255,.04)}
.hud-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.hud-dot.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:glowPulse 2s infinite}.hud-dot.off{background:#333}
.hud-em{font-size:16px}.hud-nm{flex:1;color:#ccc}.hud-dt{color:rgba(24,255,255,.4);font-size:10px;direction:ltr}.hud-pt{color:var(--cyan);font-weight:600;font-size:11px;direction:ltr}

/* ═══ BOTS ═══ */
.bots{background:linear-gradient(180deg,#0a0a14,var(--bg))}
.bots-head{text-align:center;margin-bottom:32px}.bots-head h2{font-size:24px;font-weight:700;letter-spacing:-.5px}.bots-head p{font-size:12px;color:var(--t3);margin-top:4px}
.bot-grid{max-width:900px;margin:0 auto;display:grid;gap:14px}
.bot-panel{background:linear-gradient(180deg,#061210,#0a1a14);border:1px solid rgba(0,230,118,.1);border-radius:var(--r-l);overflow:hidden;cursor:pointer;transition:all var(--slow) var(--ease);position:relative;animation:cardReveal .5s var(--ease) both}
.bot-panel::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,230,118,.015) 3px,rgba(0,230,118,.015) 4px);pointer-events:none}
.bot-panel:hover{border-color:rgba(0,230,118,.2);transform:translateY(-3px);box-shadow:0 12px 36px rgba(0,230,118,.08)}
.bot-panel:active{animation:pressScale var(--fast) var(--ease)}
.bot-hdr{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid rgba(0,230,118,.06)}
.bot-pulse{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.bot-pulse.on{background:var(--green);box-shadow:0 0 10px var(--green);animation:glowPulse 2s infinite}
.bot-pulse.off{background:#444}
.bot-nm{font-size:15px;font-weight:700;flex:1}.bot-em{font-size:24px}
.bot-thinking{display:inline-flex;gap:3px;margin-right:8px}
.bot-thinking span{width:4px;height:4px;border-radius:50%;background:var(--green);animation:dotPulse 1.5s infinite}
.bot-thinking span:nth-child(2){animation-delay:.2s}.bot-thinking span:nth-child(3){animation-delay:.4s}
.bot-metrics{display:flex;gap:8px;padding:14px 20px;flex-wrap:wrap}
.bot-metric{background:rgba(0,230,118,.05);border:1px solid rgba(0,230,118,.08);border-radius:var(--r-m);padding:10px 14px;text-align:center;flex:1;min-width:70px}

${sec("النسخ الاحتياطي المحلي → GitHub","💾","سكريبت يفحص المشاريع المحلية يومياً ويدفع أي تغييرات لـ GitHub تلقائياً",[{name:"auto-backup.sh",freq:"يومياً 2 ظهراً",cl:"#10B981",on:true,what:"meta-mcp + Money-Manager + brixtravelwebsite → GitHub"}])}
${sec("النسخ الاحتياطي على السيرفر","🖥️","أنظمة تعمل على Contabo VPS تحمي قواعد البيانات والإعدادات",[{name:"Wedding Planner Backup",freq:"كل 6 ساعات",cl:"#00E5FF",on:true,what:"نسخ قاعدة SQLite → مجلد النسخ الاحتياطي"},{name:"Wapy.dev DB Dump",freq:"يومياً 3 صباحاً",cl:"#00E5FF",on:true,what:"pg_dump لقاعدة PostgreSQL 17.5"},{name:"Wapy.dev Cleanup",freq:"يومياً 4 صباحاً",cl:"#00E5FF",on:true,what:"تنظيف النسخ القديمة والملفات المؤقتة"},{name:"Argaz Config Backup",freq:"كل ساعة",cl:"#00E5FF",on:true,what:"نسخ openclaw.json عند اكتشاف تغيير"},{name:"Gateway Watchdog",freq:"كل دقيقة",cl:"#F59E0B",on:true,what:"مراقبة OpenClaw — إعادة تشغيل تلقائية عند التوقف"}])}
${sec("المهام السحابية — Argaz Bot","🧠","مهام مجدولة في OpenClaw تعمل على السيرفر",[{name:"Morning Briefing",freq:"08:00 يومياً",cl:"#F59E0B",on:true,what:"Gmail + طقس أنطاليا + ذاكرة → إرسال ملخص Telegram"},{name:"Daily Self-Review",freq:"كل 24 ساعة",cl:"#F59E0B",on:true,what:"مراجعة التعلمات + تحديث الذاكرة"},{name:"Memory Maintenance",freq:"03:00 كل يومين",cl:"#6C3AED",on:false,what:"تنظيف وصيانة ملفات الذاكرة"},{name:"Weekly Skill Extraction",freq:"أسبوعياً",cl:"#6C3AED",on:false,what:"استخراج مهارات جديدة من التعلمات"},{name:"Error Pattern Detection",freq:"كل 3 أيام",cl:"#6C3AED",on:false,what:"كشف أنماط الأخطاء المتكررة"}])}
<div style="background:var(--bg2);border-radius:var(--r-l);padding:18px;margin-top:8px;border:1px solid var(--brd);text-align:center"><div style="font-size:11px;color:var(--t3);line-height:1.7">💡 المحلي: <span style="color:var(--green)">launchd</span> · السيرفر: <span style="color:var(--cyan)">cron + systemd</span> · Argaz: <span style="color:var(--amber)">OpenClaw Scheduler</span></div></div>
</div></div>`};

R.ideas=()=>{
const ideaRelated={"بوت واتساب ذكي":["WhatsApp CRM","BRIX Travel System"],"بوت تلقرام لبريكس":["Argaz Bot","BRIX Travel System"],"نظام تتبع مالي":["BRIX Travel System","Wapy.dev"],"BRIX Website v2":["BRIX Travel Website","BRIX Travel System"]};
return`<div class="ideas-page">
<div style="text-align:center;margin-bottom:32px;position:relative">

<h2 style="font-size:28px;font-weight:700;letter-spacing:-1px;animation:countUp .6s .1s var(--ease) both">💡 أفكار المستقبل</h2>
<p style="font-size:12px;color:var(--t3);margin-top:4px;animation:countUp .6s .2s var(--ease) both">${IDEAS.length} مشاريع مستقبلية مخططة</p>
</div>
<div style="display:flex;gap:8px;justify-content:center;margin-bottom:28px;flex-wrap:wrap">

<button class="idea-filter-btn" id="fi-1" onclick="filterIdeas(1)">🔴 عاجل</button>
<button class="idea-filter-btn" id="fi-2" onclick="filterIdeas(2)">🟡 قريب</button>
<button class="idea-filter-btn" id="fi-3" onclick="filterIdeas(3)">⚫ يوماً ما</button>
</div>
<div style="max-width:700px;margin:0 auto;position:relative;padding-right:40px">
<div style="position:absolute;right:18px;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#D946A8,#6C3AED,#25D366,#E8453C);border-radius:2px"></div>
${IDEAS.map((idea,i)=>{
const pr=idea.pr||3;const prLabel=pr===1?'🔴 عاجل':pr===2?'🟡 قريب':'⚫ يوماً ما';const prCl=pr===1?'#E8453C':pr===2?'#F59E0B':'#555';
const rel=ideaRelated[idea.name]||[];
const lines=(idea.desc||'').split('\n').filter(l=>l.trim());const headline=lines[0]||'';
const bullets=lines.filter(l=>l.startsWith('🎯')||l.startsWith('🔔')||l.startsWith('💱')||l.startsWith('📊')||l.startsWith('🔗')).slice(0,3);
return`<div class="idea-card" data-pr="${pr}" style="position:relative;margin-bottom:28px;padding-right:40px;animation-delay:${i*.15}s">
<div style="position:absolute;right:-9px;top:20px;width:20px;height:20px;border-radius:50%;background:${idea.cl};border:3px solid #0B0B0F;box-shadow:0 0 12px ${idea.cl}40;z-index:1"></div>
<div class="idea-card-inner" onclick="openDr('${E(idea.name)}')" style="border-color:transparent">
<div style="position:absolute;top:-40px;left:-40px;width:150px;height:150px;background:${idea.cl};border-radius:50%;filter:blur(60px);opacity:.06;pointer-events:none"></div>
<div style="display:flex;align-items:center;gap:14px;margin-bottom:10px;position:relative">
<div style="font-size:36px">${idea.em}</div>
<div style="flex:1"><div style="font-size:17px;font-weight:700">${E(idea.name)}</div><div style="font-size:11px;color:${idea.cl};font-weight:600;margin-top:2px">${E(idea.st)}</div></div>
<div style="padding:4px 12px;border-radius:20px;background:${prCl}20;color:${prCl};font-size:10px;font-weight:600">${prLabel}</div>
</div>
<div style="font-size:12px;color:#999;line-height:1.7;margin-bottom:10px">${E(headline)}</div>
${bullets.length?`<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:10px">${bullets.map(b=>`<div style="font-size:11px;color:#777;padding:4px 10px;background:#ffffff04;border-radius:6px;border-right:2px solid ${idea.cl}">${E(b)}</div>`).join('')}</div>`:''}
${rel.length?`<div style="display:flex;gap:6px;align-items:center;padding-top:8px;border-top:1px solid #ffffff06"><span style="font-size:9px;color:#555">يتكامل مع</span>${rel.map(r=>{const ri=[...PRJ,...BOT].find(x=>x.name===r);return ri?`<span style="font-size:13px;cursor:pointer" title="${E(r)}" onclick="event.stopPropagation();openDr('${E(r)}')">${ri.em}</span>`:''}).join('')}</div>`:''}
</div></div>`}).join('')}
</div></div>`};

R.archive=()=>`<div class="arch"><div class="arch-head"><h2>🗄️ الأرشيف</h2><p>المشاريع القديمة والملفات المؤرشفة</p></div><div class="arch-shelf">${ARC.map((a,i)=>`<div class="arch-file" onclick="openDr('${E(a.name)}')" style="animation-delay:${i*.08}s"><div class="arch-file-tab">📁 ${E(a.name)}</div><div class="arch-file-body"><div class="arch-file-em">${a.em}</div><div class="arch-file-nm">${E(a.ar)}</div><div class="arch-file-desc">${E((a.desc||'').split('\n')[0])}</div></div><div class="arch-file-tags">${(a.tags||[]).map(t=>`<span class="arch-tag">${E(t)}</span>`).join('')}</div><div class="arch-stamp">مؤرشف</div></div>`).join('')}</div></div>`;

function openDr(key){const item=M[key];if(!item)return;const lines=(item.desc||'').split('\n').filter(l=>l.trim());const headline=lines[0]||'';const stats=BSTATS[key]||[];const accentCl=item.cl||'#6C3AED';const descLines=lines.slice(1).map(l=>{const t=l.trim();if(!t)return'';if(/[:\uFF1A]/.test(t)&&t.length<60&&/[\u{1F300}-\u{1FAD6}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F900}-\u{1F9FF}]/u.test(t))return`<div class="dr-head-line">${E(t)}</div>`;return`<div class="dr-detail-row">${E(t)}</div>`}).join('');let html=`<div class="dr-header"><div class="dr-header-em">${item.em||''}</div><div class="dr-header-info"><h2>${E(item.ar||item.name)}</h2><span class="glass-st ${item.st}" style="margin-top:6px;display:inline-flex">${item.st==='a'?'نشط':item.st==='p'?'متوقف':item.st==='arc'?'مؤرشف':'فكرة'}</span></div></div>`;if(headline)html+=`<div style="font-size:13px;color:#aaa;line-height:1.7;margin-bottom:16px;padding:10px 14px;background:#ffffff04;border-right:3px solid ${accentCl};border-radius:0 8px 8px 0">${E(headline)}</div>`;if(stats.length)html+=`<div class="dr-metrics">${stats.map(s=>`<div class="dr-metric"><div class="dr-metric-v" style="color:${accentCl}">${s.v}</div><div class="dr-metric-l">${s.l}</div></div>`).join('')}</div>`;if(descLines)html+=`<div class="dr-section"><div class="dr-detail-grid">${descLines}</div></div>`;if(item.path)html+=`<div class="dr-section"><div class="dr-section-title">📁 المسار</div><div class="dr-path">${E(item.path)}</div></div>`;if(item.tags)html+=`<div class="dr-section"><div class="dr-section-title">🏷️ التقنيات</div><div class="glass-tags">${item.tags.map(t=>`<span class="glass-tag">${E(t)}</span>`).join('')}</div></div>`;if(item.links)html+=`<div class="dr-section"><div class="dr-section-title">🔗 الروابط</div><div class="dr-links">${Object.entries(item.links).map(([k,v])=>`<a class="dr-lk" href="${E(v)}" target="_blank">🔗 ${E(k)}</a>`).join('')}</div></div>`;document.getElementById('drBody').innerHTML=html;document.getElementById('dr').classList.add('open');document.getElementById('drOv').classList.add('open');location.hash=cur+'/'+encodeURIComponent(key)}
function closeDr(){document.getElementById('dr').classList.remove('open');document.getElementById('drOv').classList.remove('open');location.hash=cur}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDr();closeMore()}});
init();
(function(){const parts=location.hash.slice(1).split('/');if(parts[1]){const key=decodeURIComponent(parts[1]);if(M[key])setTimeout(()=>openDr(key),100)}})();
</script>
